<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #0a0e17;
            --bg-mid: #121a2e;
            --accent: #3b82f6;
            --accent-glow: #60a5fa;
            --accent-secondary: #8b5cf6;
            --text: #e2e8f0;
            --text-muted: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: var(--bg-deep);
            font-family: 'Outfit', sans-serif;
            color: var(--text);
            overflow: hidden;
            position: relative;
        }

        /* Fondo con gradientes animados */
        .bg-orbs {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .bg-orbs::before,
        .bg-orbs::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.4;
            animation: float 8s ease-in-out infinite;
        }

        .bg-orbs::before {
            width: 400px;
            height: 400px;
            background: var(--accent);
            top: -100px;
            right: -100px;
        }

        .bg-orbs::after {
            width: 350px;
            height: 350px;
            background: var(--accent-secondary);
            bottom: -80px;
            left: -80px;
            animation-delay: -4s;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(30px, -20px) scale(1.05); }
        }

        .container {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2rem;
            padding: 2rem;
        }

        /* GE grande */
        .ge-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 160px;
            height: 160px;
            margin-bottom: 0.5rem;
        }

        .ge-logo span {
            font-size: 5.5rem;
            font-weight: 800;
            line-height: 1;
            letter-spacing: -0.08em;
            background: linear-gradient(135deg, var(--accent-glow) 0%, var(--accent-secondary) 50%, var(--accent) 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 60px rgba(59, 130, 246, 0.5);
            filter: drop-shadow(0 0 30px rgba(96, 165, 250, 0.4));
        }

        .ge-logo span:first-child {
            margin-right: -0.05em;
        }

        /* Anillo decorativo alrededor del GE */
        .ge-ring {
            position: absolute;
            width: 200px;
            height: 200px;
            border: 2px solid transparent;
            border-top-color: var(--accent-glow);
            border-right-color: rgba(139, 92, 246, 0.5);
            border-radius: 50%;
            animation: spin-ring 3s linear infinite reverse;
            opacity: 0.6;
        }

        @keyframes spin-ring {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .ge-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 200px;
            height: 200px;
            margin-bottom: 1rem;
        }

        /* Tarjeta de contenido */
        .card {
            background: rgba(18, 26, 46, 0.7);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(148, 163, 184, 0.12);
            border-radius: 20px;
            padding: 2rem 2.5rem;
            text-align: center;
            max-width: 380px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .card h2 {
            font-size: 1.35rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--text);
        }

        .card p {
            font-size: 0.95rem;
            font-weight: 300;
            color: var(--text-muted);
            margin-bottom: 1.5rem;
        }

        /* Barra de progreso */
        .progress-wrap {
            width: 100%;
            height: 4px;
            background: rgba(148, 163, 184, 0.15);
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--accent), var(--accent-secondary));
            border-radius: 4px;
            animation: progress-fill var(--wait-time) linear forwards;
            box-shadow: 0 0 12px rgba(59, 130, 246, 0.6);
        }

        @keyframes progress-fill {
            to { width: 100%; }
        }

        .countdown {
            margin-top: 1rem;
            font-size: 0.85rem;
            color: var(--text-muted);
            font-variant-numeric: tabular-nums;
        }

        .countdown strong {
            color: var(--accent-glow);
            font-weight: 600;
        }

        /* Loader secundario */
        .dots {
            display: flex;
            gap: 6px;
            justify-content: center;
            margin-top: 1.25rem;
        }

        .dots span {
            width: 8px;
            height: 8px;
            background: var(--accent);
            border-radius: 50%;
            animation: bounce 1.4s ease-in-out infinite;
        }

        .dots span:nth-child(2) { animation-delay: 0.2s; }
        .dots span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0.6); opacity: 0.5; }
            40% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="bg-orbs" aria-hidden="true"></div>

    <div class="container">
        <div class="ge-wrapper">
            <div class="ge-ring" aria-hidden="true"></div>
            <div class="ge-logo" aria-label="GE">
                <span>G</span><span>E</span><span>T</span>
            </div>
        </div>

        <div class="card">
            <h2>Preparando G E</h2>
           
            <div class="progress-wrap">
                <div class="progress-bar"></div>
            </div>
            <p class="countdown">Espera <strong id="timer">3</strong> s</p>
            <div class="dots" aria-hidden="true">
                <span></span><span></span><span></span>
            </div>
        </div>
    </div>

    <script>
        const urlDestino = "https://depress-thus-surcharge.ngrok-free.dev/geturistas/";
        const tiempoEspera = 3000;

        document.documentElement.style.setProperty('--wait-time', tiempoEspera + 'ms');

        const timerEl = document.getElementById('timer');
        let restante = Math.ceil(tiempoEspera / 1000);

        const intervalo = setInterval(() => {
            restante--;
            if (restante > 0) {
                timerEl.textContent = restante;
            } else {
                timerEl.textContent = '0';
                clearInterval(intervalo);
            }
        }, 1000);

        setTimeout(() => {
            window.location.href = urlDestino;
        }, tiempoEspera);
    </script>

</body>
</html>
